[package]
name = "pulsaRTOS"
version = "0.1.0"
authors = ["Eli Nahoum <esnahoum@gmail.com>"]
edition = "2024"

[[bin]]
name = "pulsaRTOS"
test = true
bench = false

[dependencies]
bootloader = "0.9"
spin = "0.5.2"
